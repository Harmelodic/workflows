# $schema: https://www.schemastore.org/github-workflow.json
name: release-mkdocs

on:
  workflow_call:

jobs:
  mkdocs-gh-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - run: mkdocs build # MkDocs with strict mode => build fails on broken links, etc.
      - run: mkdocs gh-deploy --force # Deploy as GitHub Pages
